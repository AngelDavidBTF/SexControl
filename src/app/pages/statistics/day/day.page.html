<app-header titulo="Resumen diario"></app-header>

<ion-content>
<h1 class="ion-padding-horizontal">Resumen Hoy: {{ today | date: 'dd/MM/yyyy' }}</h1>
<app-totals
    [total]="faps.length"
    [totalCompania]="arrayCompania.length"
    [totalSolitario]="arraySolitario.length"
    [mediaCompania]="mediaCompania"
    [mediaSolitario]="mediaSolitario"
  ></app-totals>
  <ion-item-divider>
    <ion-label>
      Listado
    </ion-label>
  </ion-item-divider>
  <ion-item *ngFor="let fap of faps">
    <ion-icon
      *ngIf="fap.data.solitario"
      name="person"
      slot="start"
      color="primary"
    ></ion-icon>
    <ion-icon
      *ngIf="!fap.data.solitario"
      slot="start"
      color="secondary"
      name="people"
    ></ion-icon>
    <ion-label>
      <h2>{{ fap.data.fecha }}</h2>
    </ion-label>
  </ion-item>
</ion-content>
