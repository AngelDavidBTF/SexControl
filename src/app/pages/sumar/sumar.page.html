<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Sumar</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/ajustes" aria-label="Perfil y ajustes" class="ir-ajustes">
        <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <h5 class="ion-margin">Hola, {{ displayName }}, este es tu resumen general.</h5>

  <ion-img *ngIf="!neutral()" src="assets/logo-sexcontrol.svg"></ion-img>

  <ng-container *ngIf="showLoader">
    <div class="ion-text-center">
      <ion-spinner name="circular" color="danger"></ion-spinner>
    </div>
  </ng-container>

  <ng-container *ngIf="!showLoader">
    <div class="contenedorNumeros">
      <ion-text color="secondary">
        <p class="letras">En compañía</p>
        <h1 class="numero" dato>{{ numberC }}</h1>
      </ion-text>
      <ion-text color="primary">
        <p class="letras">En solitario</p>
        <h1 class="numero" dato>{{ numberS }}</h1>
      </ion-text>
    </div>
    <div class="contenedorTotal">
      <ion-text color="tertiary">
        <p class="letras">Total</p>
        <h1 class="total" dato>{{ numberTotal }}</h1>
      </ion-text>
    </div>

    <div class="objetivos" *ngIf="goals.length">
      <div class="objetivo" *ngFor="let goal of goals">
        <div class="objetivo-texto">
          <span>{{ goal.label }}</span>
          <strong dato class="objetivo-valor">{{ goal.done }} / {{ goal.target }}{{ goal.done >= goal.target ? ' 🎯' : '' }}</strong>
        </div>
        <ion-progress-bar [value]="goal.progress" [color]="goal.done >= goal.target ? 'success' : 'tertiary'"></ion-progress-bar>
      </div>
    </div>
  </ng-container>

  <div class="contenedorBoton">
    <ion-grid fixed>
      <ion-row>
        <ion-col size="6">
          <div class="boton">
            <ion-button size="default" color="secondary" (click)="sumar(false)">
              <ion-icon slot="start" name="people"></ion-icon>
              En compañía</ion-button
            >
          </div>
        </ion-col>
        <ion-col size="6">
          <div class="boton">
            <ion-button size="default" color="primary" (click)="sumar(true)">
              <ion-icon name="person" slot="start"></ion-icon>
              En solitario</ion-button
            >
          </div>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
          <div class="boton">
            <ion-button size="default" fill="outline" color="medium" (click)="sumarOlvidada()" class="sumar-olvidada">
              <ion-icon slot="start" name="time-outline"></ion-icon>
              Añadir una olvidada
            </ion-button>
          </div>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
          <div class="boton">
            <ion-button size="default" color="tertiary" (click)="borrar()">Borrar último</ion-button>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
