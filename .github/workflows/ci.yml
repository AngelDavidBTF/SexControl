name: CI

# Solo lo que no necesita secretos: los tests unitarios y la build de producción.
# Las pruebas de reglas y los E2E van contra el proyecto real de Firebase y necesitan el token de
# depuración de App Check y las cuentas de prueba, así que se lanzan a mano (ver tests/README.md).
on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests unitarios
        run: npm test

      - name: Build de producción
        run: npm run build -- --configuration production

      - name: Navegador para el humo de la build
        run: npx playwright install --with-deps chromium

      # Comprueba lo que se le escapó a las pruebas de desarrollo: que la build optimizada
      # registra los componentes de Ionic y no sale en blanco.
      - name: Humo de la build
        run: node tests/ci/build-smoke.js
