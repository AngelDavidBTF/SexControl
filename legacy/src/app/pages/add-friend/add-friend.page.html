<app-header titulo="Añadir amigo"></app-header>

<ion-content>
  <ion-searchbar placeholder="Buscar usuario"
                 (ionChange)="onSearchChange($event)"
                 inputmode="text"
                 animated
                 ></ion-searchbar>
  
  <ng-container *ngIf="textoBuscar != ''; else elseTemplate">
    <ion-item *ngFor="let user of users.data | filtro:textoBuscar:'email'" button (click)="enviarPeticon(user.id)">
      <ion-avatar slot="start">
        <img *ngIf="user.photoURL !== null" [src]="user.photoURL" />
        <img *ngIf="user.photoURL === null" src="../../assets/icon-user.svg" />
      </ion-avatar>
      <ion-label>
        <h2>{{ user.displayName }}</h2>
        <p text-wrap>{{ user.email }}</p>
      </ion-label>
      <ion-icon name="person-add" slot="end"></ion-icon>
    </ion-item>
  </ng-container>
  <ng-template #elseTemplate>
    <h5 class="textSearch">Introduce un nombre de usuario o un email, para poder enviar una solicitud de amistad. <br>
      (Por motivos de privacidad no se muestran resultados hasta introducir texto).</h5>
  </ng-template>
  
  
</ion-content>
