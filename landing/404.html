<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aquí no hay nada · Follendario</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <style>
    @font-face { font-family: 'Archivo Black'; src: url('/fonts/archivo-black-400.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Geist'; src: url('/fonts/geist-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Geist'; src: url('/fonts/geist-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; text-align: center; background: #10081a; color: #fcf3ed; font: 400 16px/1.5 'Geist', system-ui, sans-serif; }
    h1 { margin: 0; font: 400 clamp(2.4rem, 12vw, 5rem)/0.9 'Archivo Black', system-ui, sans-serif; text-transform: uppercase; }
    p { margin: 16px auto 28px; max-width: 32ch; color: #a597b3; }
    a { display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 12px; background: #fc2a6c; color: #10081a; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 3px solid #fcf3ed; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Aquí no ha pasado nada.</h1>
    <p>Esta página no existe. Vuelve al inicio, que ahí sí hay movimiento.</p>

  </main>
